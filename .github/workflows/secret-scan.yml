name: secret-scan

# Runs gitleaks over the full git history (every commit, every ref) with a
# pinned release binary, so a first push and a fork behave the same.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every ref
        run: git fetch --all --tags --prune --force
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: gitleaks over full history
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all" .
